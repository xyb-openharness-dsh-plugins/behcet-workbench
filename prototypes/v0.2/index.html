function datasetStats(set){
  const recs=set&&Array.isArray(set.records)?set.records:[];
  const built=buildMetricsFor(set);
  const stages=typeof window.BEIPAL_PATHWAY_MODEL?.build==='function'?window.BEIPAL_PATHWAY_MODEL.build(recs,set.metrics||[]):[];
  const counts={};recs.forEach(r=>{counts[r.kind]=(counts[r.kind]||0)+1});
  const order=['发作记录','当前用药','问题清单','资料库'];
  const kindText=order.filter(k=>counts[k]).map(k=>`${k} ${counts[k]}`).concat(Object.keys(counts).filter(k=>!order.includes(k)).map(k=>`${k} ${counts[k]}`)).join(' · ');
  const priv=recs.filter(r=>r.private===true).length;
  const unknown=recs.filter(r=>datePrecision(r)==='unknown').length;
  const month=recs.filter(r=>datePrecision(r)==='month').length;
  const unknownGroups=built.filter(m=>!m.unit).length;
  const incomplete=built.filter(m=>m.complete===false).length;
  const ambiguous=built.filter(m=>m.complete&&m.dated.length>1&&m.segments.length===0).length;
  const privateStages=stages.filter(s=>s.private).length;
  const gaps=[];
  if(unknown)gaps.push(`日期未知 ${unknown} 条`);
  if(month)gaps.push(`仅知月份 ${month} 条`);
  if(unknownGroups)gaps.push(`单位未知 ${unknownGroups} 组`);
  if(incomplete)gaps.push(`可比信息不完整 ${incomplete} 组`);
  if(ambiguous)gaps.push(`同日无序 ${ambiguous} 组`);
  if(privateStages)gaps.push(`私密治疗阶段 ${privateStages} 段`);
  return {countText:[`${recs.length} 条记录（私密 ${priv}）`,kindText,`${(set.metrics||[]).length} 项指标 / ${built.length} 个可比组`,`${(set.events||[]).length} 个事件`].filter(Boolean).join(' · '),gapText:gaps.length?gaps.join(' · '):'无结构性缺口'};
}

  if(b.dataset.drop){state.candidates=state.candidates.filter(x=>x.id!==+b.dataset.drop);render();return}
  if(b.dataset.fileDel){let f=needFile(+b.dataset.fileDel);if(!f)return
    dialog('移除原件',`<p>从资料目录移除 <strong>${esc(f.name)}</strong>？</p><p class="muted">移除登记、相关候选与本机文本缓存；已采纳的记录保留，但不再关联这个原件。你电脑上的原文件不会被删除，本演示也没有云端副本。</p>`,
      `<button data-action="cancel">取消</button><button class="primary" data-file-del-confirm="${f.id}">移除</button>`);return}
  if(b.dataset.fileDelConfirm){let id=+b.dataset.fileDelConfirm
    state.files=state.files.filter(f=>f.id!==id);state.candidates=state.candidates.filter(c=>c.fileId!==id)
    state.records.forEach(r=>{if(r.fileId===id){r.fileId=null;r.original=null}})
    $('#dialog').close();render();toast('已移除原件；相关记录保留为「无原件」');return}
})
</script>
<script>
/* 打印时展开全部治疗阶段。Chrome 打印中闭合 details 的内容不参与排版，
   @media print 单独改 display 无效，所以必须在 beforeprint 打开；打印后恢复原状。 */
(function printExpandFoldouts(){
  let prior=null;
  window.addEventListener('beforeprint',()=>{
    const folds=[...document.querySelectorAll('details.phase-fold')];
    if(prior===null)prior=folds.map(d=>({id:String(d.dataset.phaseId||''),open:d.open}));
    folds.forEach(d=>{d.open=true});
  });
  window.addEventListener('afterprint',()=>{
    if(prior===null)return;
    const saved=new Map(prior.map(x=>[x.id,x.open]));
    document.querySelectorAll('details.phase-fold').forEach(d=>{
      const id=String(d.dataset.phaseId||'');
      d.open=saved.has(id)?saved.get(id):false;
    });
    prior=null;
  });
})();
</script></body></html>
