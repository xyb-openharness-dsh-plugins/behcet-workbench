  let b=e.target.closest('button');if(!b)return
  if(b.dataset.go){go(b.dataset.go);return}
  if(b.dataset.parse){let f=needFile(+b.dataset.parse);if(!f)return
    dialog('模拟抽取（不联网）',`<p>将要在本机读取的原件：</p><p><strong>${esc(f.name)}</strong>（${fmtSize(f.size)}）</p>
      <p class="muted">本演示只在你的浏览器里按行切出候选，不会把文件发送给任何服务，也不会生成日期或诊断。</p>
      ${f.content?'':'<p>该类型在本演示中不能抽取（没有 OCR/PDF 解析），可登记后手工记录。</p>'}
      <label><input type="checkbox" id="parse-consent"> 我已了解：本次抽取只在本机进行</label><p id="parse-err" role="alert"></p>`,
      `<button data-action="cancel">取消</button><button class="primary" data-parse-run="${f.id}">开始本机抽取</button>`);return}
  if(b.dataset.parseRun){let f=needFile(+b.dataset.parseRun);if(!f)return
    if(!document.querySelector('#parse-consent').checked){document.querySelector('#parse-err').textContent='请先勾选「只在本机进行」再开始';return}
    if(!f.content&&f.blob&&f.blob.text){try{f.content=await f.blob.text()}catch{}}
    if(!f.content){document.querySelector('#parse-err').textContent='该类型不支持本机抽取，请手工记录';return}
    let n=runMockExtract(f);$('#dialog').close();render();toast(n?`已生成 ${n} 条候选，需逐条采纳`:'这份文本里没有可切出的候选行');return}
  if(b.dataset.parseRevoke){state.candidates=[];render();toast('已撤回授权，候选缓存已清空');return}
  if(b.dataset.accept){let c=state.candidates.find(x=>x.id===+b.dataset.accept);if(!c)return
    let f=fileById(c.fileId)
    state.records.unshift({id:Date.now(),kind:'资料库',date:new Date().toISOString().slice(0,10),text:c.text,source:`原件：${c.fileName}`,fileId:c.fileId,original:{title:c.fileName,text:c.text},private:!!(f&&f.private),history:[]})
    state.candidates=state.candidates.filter(x=>x.id!==c.id);render();toast('已采纳为一条资料记录，可在资料库回看');return}
  if(b.dataset.drop){state.candidates=state.candidates.filter(x=>x.id!==+b.dataset.drop);render();return}
  if(b.dataset.fileDel){let f=needFile(+b.dataset.fileDel);if(!f)return
    dialog('移除原件',`<p>从资料目录移除 <strong>${esc(f.name)}</strong>？</p><p class="muted">已采纳的记录会保留，但不再关联这个原件；本演示不留存文件内容。</p>`,
      `<button data-action="cancel">取消</button><button class="primary" data-file-del-confirm="${f.id}">移除</button>`);return}
  if(b.dataset.fileDelConfirm){let id=+b.dataset.fileDelConfirm
    state.files=state.files.filter(f=>f.id!==id);state.candidates=state.candidates.filter(c=>c.fileId!==id)
    state.records.forEach(r=>{if(r.fileId===id){r.fileId=null;r.original=null}})
    $('#dialog').close();render();toast('已移除原件；相关记录保留为「无原件」');return}
})
</script>
<script>
/* 打印时展开全部治疗阶段。Chrome 打印中闭合 details 的内容不参与排版，
   @media print 单独改 display 无效，所以必须在 beforeprint 打开；打印后恢复原状。 */
(function printExpandFoldouts(){
  let prior=null;
  window.addEventListener('beforeprint',()=>{
    const folds=[...document.querySelectorAll('details.phase-fold')];
    if(prior===null)prior=folds.map(d=>({id:String(d.dataset.phaseId||''),open:d.open}));
    folds.forEach(d=>{d.open=true});
  });
  window.addEventListener('afterprint',()=>{
    if(prior===null)return;
    const saved=new Map(prior.map(x=>[x.id,x.open]));
    document.querySelectorAll('details.phase-fold').forEach(d=>{
      const id=String(d.dataset.phaseId||'');
      d.open=saved.has(id)?saved.get(id):false;
    });
    prior=null;
  });
})();
</script></body></html>
