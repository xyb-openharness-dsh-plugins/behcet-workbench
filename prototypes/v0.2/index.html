og-body{overflow:auto;max-height:60vh}.dialog-foot{border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#24483e;color:white;border-radius:10px;padding:10px 18px;z-index:10}.skip{position:absolute;left:-9999px}.skip:focus{left:10px;top:10px;z-index:10}.big{font-size:18px}@media(max-width:900px){.business{display:block}nav{display:flex;overflow:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}nav button{width:auto;white-space:nowrap;margin:0}.grid{grid-template-columns:minmax(0,1fr)}.top{flex-wrap:wrap}.top .status{flex-basis:100%;order:3}.pane{position:fixed;right:0;top:65px;bottom:0;width:min(420px,100%)!important;z-index:4;box-shadow:-8px 0 30px #204c3620}.splitter{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

</style></head><body><a class="skip" href="#main">跳到主要内容</a><header class="top"><button class="brand" data-view="看板">✿ 小贝宝 BeiPal</button><span class="version">原型 v0.2</span><span class="status">合成示例 · 仅本页临时演示 · 未连接宿主</span><button id="large">大字</button><button id="pane-toggle" aria-expanded="false">AI 对话演示</button><button id="pane-close" aria-label="收起 AI 对话演示" hidden>×</button></header><div class="layout"><div class="business"><nav id="nav" aria-label="工作台导航"></nav><main id="main" tabindex="-1"></main></div><div id="splitter" class="splitter" role="separator" aria-label="调整 AI 演示面板宽度" aria-orientation="vertical" aria-valuemin="25" aria-valuemax="45" aria-valuenow="35" tabindex="0" hidden></div><aside id="pane" class="pane" aria-label="右侧宿主模拟" hidden><div class="eyebrow">右侧面板 · 状态稿</div><h2>原生 AI 对话位置</h2><div class="notice">宿主模拟 / 非真实 DSH 会话。没有连接、发送或回复。</div><div class="panelbox"><p>这里预留给宿主提供的原生会话。工作台本身不会复制聊天界面。</p><p class="muted">讨论草稿仅在下方预览，不会自动发送；私密记录不进入草稿。</p><label class="field">待复制草稿<textarea id="draft" placeholder="选择“和 AI 讨论”生成预览" readonly></textarea></label><button id="copy">复制草稿</button><p id="copy-status" class="muted" role="status"></p></div></aside></div><dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog" aria-label="关闭">×</button></div><div class="dialog-body" id="dialog-body"></div><div class="dialog-foot" id="dialog-foot"></div></dialog><div class="toast" id="toast" role="status" hidden></div>
<script src="demo-data.js"></script><script src="metric-model.js"></script><script>
const pages=['看板','发作与病程','器官与专科','病情整理','病情一图秀','治疗与用药','复诊与准备','长期与生活'];
const subs={'发作与病程':['病程与诊断过程','发作记录','症状记录','发作回顾','部位与愈合'],'器官与专科':['眼','血管','神经','消化道','皮肤·关节·口腔'],'病情整理':['资料库','整理草稿 / 核对','病情档案','指标检测','病情汇总'],'病情一图秀':['指标趋势','治疗与事件节点'],'治疗与用药':['当前用药','变更与更正','副作用与感受','用药前检查记录'],'复诊与准备':['问题清单','就诊准备与导出','什么情况要马上就医'],'长期与生活':['心理与家庭','生育·性健康与用药','工作·费用·异地就医']};
/* 数据不可用时显示错误状态，示例数据仍只来自 demo-data.js。 */
const DEMO_OK=Array.isArray(window.BEIPAL_DEMO_RECORDS)&&Array.isArray(window.BEIPAL_METRICS)&&window.BEIPAL_METRICS.length>0&&Array.isArray(window.BEIPAL_EVENTS)&&typeof window.BEIPAL_METRIC_MODEL?.build==='function';
const demoRecords=DEMO_OK?window.BEIPAL_DEMO_RECORDS:[];
const demoMetrics=DEMO_OK?window.BEIPAL_METRICS:[];
const demoEvents=DEMO_OK?window.BEIPAL_EVENTS:[];
let state={view:'看板',sub:'',records:demoRecords.map(r=>({...r,history:[...(r.history||[])]})),selected:new Set(demoRecords.filter(r=>!r.private).map(r=>r.id)),timelineSelected:new Set(),width:35,range:'all',zoom:100,pin:null,showEvents:true,metricIds:new Set((DEMO_OK?window.BEIPAL_METRIC_MODEL.build(demoMetrics):[]).slice(0,3).map(m=>m.id)),flipped:new Set()};
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(el.timer);el.timer=setTimeout(()=>el.hidden=true,3000)}
function go(view,sub=''){state.view=view;state.sub=sub||((subs[view]||[])[0]||'');render();$('#main').focus({preventScroll:true});window.scrollTo(0,0)}
function nav(){ $('#nav').innerHTML=pages.map(p=>`<button data-view="${p}" ${p===state.view?'aria-current="page"':''}>${p}</button>`).join('')+'<button data-action="privacy">授权与隐私</button><button data-action="directory">资料目录与云解析</button>' }
function rec(r,owner=false){let history=owner?r.history:r.history.filter(h=>h&&typeof h==='object'&&h.private===false);return `<div class="row"><span class="tag ${r.private?'private-tag':''}">${r.private?'私密':'本人记录'}</span> <small>${esc(r.date)} · ${esc(r.source)}</small>${r.kind==='发作记录'?`<p>开始：${esc(r.date)} · 结束：${esc(r.endDate||'未知')} · 部位：${esc(r.site||'未知')}</p>`:''}<p>${esc(r.text)}</p><details><summary>⋯ 更多</summary><button data-correct="${r.id}">改这一条</button>${history.length?`<p>更正前：${history.map(h=>esc(typeof h==='string'?h:`开始：${h.date} · 结束：${h.endDate||'未知'} · 部位：${h.site||'未知'} · 原文：${h.text} · 来源：${h.source} · ${h.private===true?'私密':h.private===false?'非私密':'隐私状态未知'}`)).join('；')}</p>`:''}</details></div>`}
function episodeForm(r={}){return `<p>仅保存在本页内存，刷新后重置。结束日期未知时留空；不会推算持续时间。</p><p id="episode-errors" role="alert"></p><label class="field">开始日期<input id="entry-date" type="date" value="${esc(r.date||'')}"></label><label class="field">结束日期（未知可留空）<input id="entry-end" type="date" value="${esc(r.endDate||'')}"></label><label class="field">部位<input id="entry-site" value="${esc(r.site||'')}" placeholder="例如口腔；未知可留空"></label><label class="field">原文<textarea id="entry-text" placeholder="按自己的话记录">${esc(r.text||'')}</textarea></label><label class="field">来源<input id="entry-source" value="${esc(r.source||'')}" placeholder="例如本人记录；未知可留空"></label><label><input type="checkbox" id="entry-private" ${r.private?'checked':''}> 标记为私密</label>`}
function readEpisode(){let date=$('#entry-date').value,endDate=$('#entry-end').value,text=$('#entry-text').value.trim(),errors=[];document.querySelectorAll('#dialog-body [aria-invalid]').forEach(el=>{el.removeAttribute('aria-invalid');el.removeAttribute('aria-describedby')});if(!date)errors.push(['#entry-date','请填写开始日期']);if(!text)errors.push(['#entry-text','请填写原文']);if(date&&endDate&&endDate<date)errors.push(['#entry-end','结束日期不能早于开始日期']);let box=$('#episode-errors');box.textContent=errors.map(x=>x[1]).join('；');if(errors.length){errors.forEach(([selector])=>{let el=$(selector);el.setAttribute('aria-invalid','true');el.setAttribute('aria-describedby','episode-errors')});$(errors[0][0]).focus();return null}return {date,endDate,site:$('#entry-site').value.trim(),text,source:$('#entry-source').value.trim()||'来源未知',private:$('#entry-private').checked}}
function pageHeader(title,desc){return `<div class="eyebrow">我的资料 · 合成示例</div><h1>${title}</h1><p class="muted">${desc}</p><div class="actions"><button data-action="discuss">和 AI 讨论</button><button data-view="看板">回到看板</button></div>`}
function dashboard(){return `<div class="hero"><div class="eyebrow">BEIPAL · 你的记录，由你做主</div><h1>把零散的日子，慢慢整理起来。</h1><p>记下自己的感受，回看资料，为下一次见面做好准备。</p><span class="tag">合成示例数据</span> <span class="tag">原型 · 刷新后重置</span><div class="actions"><button data-action="discuss">和 AI 讨论</button></div></div><div class="section"><h2>从今天想做的事开始</h2></div><div class="grid">${[['今天要记什么','记录发作','发作与病程','发作记录'],['时间线上看变化','跨科时间线','病情一图秀','治疗与事件节点'],['安全提示','求助信息','复诊与准备','什么情况要马上就医'],['家人帮我记','以代记者身份记录','',''], ['资料整理','血管资料','器官与专科','血管'],['今天要记什么','消化症状','器官与专科','消化道'],['用药','记录治疗','治疗与用药','当前用药'],['下次复诊','记录医嘱','治疗与用药','当前用药'],['今天要记什么','生活影响','长期与生活','工作·费用·异地就医'],['最近检查','整理报告','病情整理','整理草稿 / 核对'],['下次复诊','准备材料','复诊与准备','就诊准备与导出'],['只给我自己看','私密问题','复诊与准备','问题清单'],['用药','用药前检查记录','治疗与用药','用药前检查记录']].map(([a,b,v,s])=>`<div class="card"><small>${a}</small><h3>${b}</h3><button class="link" ${v?`data-view="${v}" data-sub="${s}"`:'data-action="privacy"'}>查看 →</button></div>`).join('')}<div class="card private"><h3>只给我自己看</h3><p>私密记录默认不进入摘要、导出和 AI 草稿。</p><button class="link" data-action="privacy">私密标记与授权 →</button></div></div><div class="section"><h2>最近的记录</h2><button data-view="发作与病程" data-sub="发作记录">查看记录</button></div><div class="card">${state.records.filter(r=>!r.private).map(r=>rec(r)).join('')}</div>`}
function recordPage(){let items=state.records.filter(r=>r.kind===state.sub);return `<div class="card"><div class="section" style="margin:0 0 12px"><h2>${esc(state.sub)}</h2><button data-action="add">手工补一条</button></div><p class="muted">内容由本人填写；未知可以留空，不作医学判断。仅保存在本页内存，刷新后重置。</p>${items.length?items.map(r=>rec(r,true)).join(''):'<div class="empty">暂时没有示例记录。可从“⋯ 更多”手工补一条。</div>'}</div>`}
function timeline(){return `<div class="card"><h2>跨科时间线</h2><p>选择记录后按日期并列展示；不同来源保留各自原文，不判断因果。私密记录默认不选。本演示仅在本页内存中运行，刷新后重置。</p><fieldset><legend>选择要显示的记录</legend>${state.records.map(r=>`<label class="row" style="display:block"><input type="checkbox" data-timeline-select="${r.id}" ${state.timelineSelected.has(r.id)?'checked':''}> ${r.private?'<span class="tag private-tag">私密 · 逐条选择</span> ':''}${esc(r.date||'日期未知')} · ${esc(r.department||'科别未知')} · ${esc(r.text)}</label>`).join('')}</fieldset></div>`}

document.addEventListener('click',e=>{let timelineSource=e.target.closest('[data-timeline-source]');if(timelineSource){let r=state.records.find(x=>String(x.id)===timelineSource.dataset.timelineSource);if(r)dialog('记录来源',`<p>${esc(r.date||'日期未知')} · ${esc(r.department||'科别未知')}</p><p>来源：${esc(r.source||'来源未知')}</p>${r.original?`<h3>${esc(r.original.title)}</h3><p>${esc(r.original.text)}</p><p>以上为合成演示原件，并非真实病历。</p>`:'<p>无原件；仅有当前记录，未提供原始文件。</p>'}`,`<button data-action="cancel">关闭</button>`);return}let source=e.target.closest('[data-source]');if(source){source.focus({preventScroll:true});showSource(source.dataset.source,source.dataset.date);return}let card=e.target.closest('.mcard');if(card&&!e.target.closest('button,a,input,select,textarea,[role=button]')){flipCard(card);return}let point=e.target.closest('[data-point]');if(point){togglePin(point.dataset.point,point.dataset.date);return}let b=e.target.closest('button');if(!b)return;if(b.dataset.range){state.range=b.dataset.range;document.querySelectorAll('[data-range]').forEach(el=>el.setAttribute('aria-pressed',el===b));refreshChart();return}if(b.dataset.pin){state.pin={id:b.dataset.pin,date:b.dataset.date};refreshChart();return}if(b.hasAttribute('data-clear-pin')){state.pin=null;refreshChart();return}if(b.dataset.source){showSource(b.dataset.source,b.dataset.date);return}if(b.dataset.view){go(b.dataset.view,b.dataset.sub);return}if(b.dataset.correct){let r=state.records.find(x=>x.id===+b.dataset.correct);dialog('改这一条',r.kind==='发作记录'?episodeForm(r):`<p>更正后可查看之前的内容。仅影响当前演示。</p><label class="field">记录内容<textarea id="entry-text">${esc(r.text)}</textarea></label>`,`<button data-action="cancel">取消</button><button class="primary" data-save-correction="${r.id}">保存更正</button>`);return}if(b.dataset.saveCorrection){let r=state.records.find(x=>x.id===+b.dataset.saveCorrection);if(r.kind==='发作记录'){let updated=readEpisode();if(!updated)return;r.history.push({date:r.date,endDate:r.endDate,site:r.site,text:r.text,source:r.source,private:r.private});Object.assign(r,updated);if(r.private){state.selected.delete(r.id);state.timelineSelected.delete(r.id)}$('#draft').value=''}else{let text=$('#entry-text').value.trim();if(!text){toast('请填写记录内容');return}r.history.push(r.text);r.text=text}render();$('#dialog').close();toast('已在本次演示中保存更正');return}switch(b.dataset.action){case 'add':if(state.sub==='发作记录'){dialog('手工补一条发作',episodeForm(),`<button data-action="cancel">取消</button><button class="primary" data-action="save-episode">保存示例</button>`);break}dialog('手工补一条',`<p>仅保存到本次页面演示；刷新后重置。</p><label class="field">日期<input id="entry-date" type="date"></label><label class="field">本人记录<textarea id="entry-text" placeholder="按自己的话记录"></textarea></label><label><input type="checkbox" id="entry-private" ${['问题清单','心理与家庭','生育·性健康与用药'].includes(state.sub)?'checked':''}> 标记为私密（私密问题建议保留标记）</label>`,`<button data-action="cancel">取消</button><button class="primary" data-action="save">保存示例</button>`);break;case 'save-episode':{let entry=readEpisode();if(!entry)return;state.records.push({id:Date.now(),kind:'发作记录',...entry,history:[]});render();$('#dialog').close();toast('已添加到本次演示');break}case 'save':{let text=$('#entry-text').value.trim(),date=$('#entry-date').value;if(!text||!date){toast('请填写日期与记录内容');return}state.records.push({id:Date.now(),kind:state.sub,date,text,source:'本人记录 · 本次演示',private:$('#entry-private').checked,history:[]});render();$('#dialog').close();toast('已添加到本次演示');break}case 'cancel':$('#dialog').close();break;case 'directory':dialog('资料目录与云解析',`<p>这是设置入口的占位演示。尚未接入目录选择、文件导入或云解析，也不会上传资料。</p><p>解析授权、撤回、候选核对与失败恢复尚未实现；可从资料库手工添加示例记录。</p>`,`<button data-action="cancel">关闭</button><button data-action="open-library">打开资料库</button>`);break;case 'open-library':$('#dialog').close();go('病情整理','资料库');break;case 'privacy':dialog('授权与隐私',`<p>私密记录默认不进入摘要、导出和 AI 草稿。摘要及导出可由本人逐条选择；私密内容目前不能进入 AI 草稿。</p><p>代记授权、撤回与读取范围仅为设计占位，尚未连接身份或权限服务。</p>`,`<button data-action="cancel">知道了</button>`);break;case 'discuss':{let rs=state.records.filter(r=>!r.private);$('#draft').value='讨论草稿（合成示例；本人记录，不等于医学审核）\n'+rs.map(r=>`${episodeFields(r)||r.date+' '}${r.text}｜${r.source}`).join('\n')+'\n请帮助我整理这些记录中想问的问题。';openPane();toast('已生成草稿预览；没有发送');break}case 'download':{let text='小贝宝 · 复诊材料示例\n合成数据；本人记录，不等于医学审核\n\n'+state.records.filter(r=>state.selected.has(r.id)).map(r=>`${r.private?'【私密】 ':''}${episodeFields(r)||r.date+' '}${r.text}｜${r.source}`).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download='beipal-demo.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('已生成所选示例文本');break}}});
document.addEventListener('keydown',e=>{if(e.target.matches('.mcard')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();flipCard(e.target);return}if(e.target.matches('circle[data-source]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();showSource(e.target.dataset.source,e.target.dataset.date);return}if(e.target.matches('[data-point]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();togglePin(e.target.dataset.point,e.target.dataset.date)}});document.addEventListener('input',e=>{if(e.target.id==='chart-zoom'){state.zoom=Number(e.target.value);$('#zoom-value').textContent=state.zoom+'%';refreshChart()}});document.addEventListener('change',e=>{if(e.target.dataset.timelineSelect){let id=+e.target.dataset.timelineSelect;e.target.checked?state.timelineSelected.add(id):state.timelineSelected.delete(id);$('#timeline-results').outerHTML=timelineResults();return}if(e.target.id==='show-events'){state.showEvents=e.target.checked;refreshChart();return}if(e.target.dataset.metric){let id=e.target.dataset.metric;if(e.target.checked&&state.metricIds.size>=4){e.target.checked=false;toast('先去掉一项再选择新的指标');return}e.target.checked?state.metricIds.add(id):state.metricIds.delete(id);refreshChart();return}if(e.target.dataset.select){let id=+e.target.dataset.select;e.target.checked?state.selected.add(id):state.selected.delete(id);let preview=document.querySelector('#export-preview');if(preview)preview.innerHTML=visitPreview()}});$('#dialog').addEventListener('close',()=>{let target=dialogOpener?.isConnected?dialogOpener:dialogOpenerSelector&&document.querySelector(dialogOpenerSelector);if(target){let details=target.closest('details');if(details)details.open=true;target.focus({preventScroll:true})}else $('#main').focus({preventScroll:true});dialogOpener=null;dialogOpenerSelector=null});window.addEventListener('resize',updateChartScrollHint);$('#close-dialog').onclick=()=>$('#dialog').close();$('#large').onclick=()=>document.body.classList.toggle('big');$('#pane-toggle').onclick=()=>$('#pane').hidden?openPane():closePane();$('#pane-close').onclick=closePane;$('#copy').onclick=async()=>{let t=$('#draft').value;if(!t){$('#copy-status').textContent='先在页面选择“和 AI 讨论”生成草稿。';return}try{await navigator.clipboard.writeText(t);$('#copy-status').textContent='已复制草稿；没有发送。'}catch{$('#copy-status').textContent='复制不可用，请选中文字手动复制。';$('#draft').focus();$('#draft').select()}};$('#splitter').addEventListener('keydown',e=>{let n=state.width;if(e.key==='ArrowLeft')n+=2;else if(e.key==='ArrowRight')n-=2;else if(e.key==='Home')n=25;else if(e.key==='End')n=45;else return;e.preventDefault();width(n)});$('#splitter').addEventListener('pointerdown',e=>{e.currentTarget.setPointerCapture(e.pointerId)});$('#splitter').addEventListener('pointermove',e=>{if(!e.currentTarget.hasPointerCapture(e.pointerId))return;let r=$('.layout').getBoundingClientRect();width(Math.round((r.right-e.clientX)/r.width*100))});render();
</script></body></html>
